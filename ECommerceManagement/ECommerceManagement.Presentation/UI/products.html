<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Products</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
}
h1 { color: #333; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
}
th { background-color: #667eea; color: white; }
button {
    padding: 6px 12px;
    border: none;
    border-radius: 5px;
    background-color: #5a67d8;
    color: white;
    cursor: pointer;
}
button:hover { background-color: #4c5ac1; }
</style>
</head>
<body>
<h1>Products</h1>
<table id="productsTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <!-- سيتم تعبئة المنتجات ديناميكيًا -->
    </tbody>
</table>
<script>
// مثال: يمكن لاحقًا تعبئته بالـ C# أو جلب البيانات عبر WebMessage
const products = [
    { name: "Laptop", price: 1500, category: "Electronics" },
    { name: "Smartphone", price: 800, category: "Electronics" },
    { name: "C# Book", price: 50, category: "Books" }
];

const tbody = document.getElementById("productsTable").querySelector("tbody");
products.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${p.name}</td>
                    <td>$${p.price}</td>
                    <td>${p.category}</td>
                    <td><button onclick="addToCart('${p.name}')">Add to Cart</button></td>`;
    tbody.appendChild(tr);
});

function addToCart(productName) {
    window.chrome.webview.postMessage({ action: "addToCart", product: productName });
}
</script>
</body>
</html>
